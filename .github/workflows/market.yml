name: Threads weekly public research (disabled by default)
on:
  schedule:
    - cron: '0 23 * * 0' # Monday 08:00 Asia/Tokyo; execution may be delayed
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: threads-publication
  cancel-in-progress: false
jobs:
  research:
    if: vars.THREADS_MARKET_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-private.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: State author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Approved read-only research and private report
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_STATE_KEY: ${{ secrets.THREADS_STATE_KEY }}
          THREADS_MARKET_CONFIG: ${{ secrets.THREADS_MARKET_CONFIG }}
        run: python -m threads_publisher market --private-state --persist-git
      - name: Safe failure notice
        if: failure()
        run: echo 'Public research failed or requires additional permission. Partial results stay encrypted; no publishing or paid AI requests performed.' >> "$GITHUB_STEP_SUMMARY"
