name: Threads daily analytics (disabled by default)
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      confirm_read:
        type: boolean
        default: false
        description: Approve GET-only own Insights collection for this run
permissions:
  contents: read
concurrency:
  group: threads-publication
  cancel-in-progress: false
jobs:
  operation:
    if: vars.THREADS_ANALYTICS_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node.js 24
        with:
          python-version: '3.12'
      - name: Install encryption dependency
        run: python -m pip install -r requirements-private.txt -r requirements-media.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Configure private state author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Fetch latest own Insights (GET only)
        if: github.event_name == 'schedule' || inputs.confirm_read
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_STATE_KEY: ${{ secrets.THREADS_STATE_KEY }}
        run: python -m threads_publisher insights --latest --private-state --backfill-metadata --persist-git
      - name: Failure guidance
        if: failure()
        run: echo 'Operation failed. Inspect permissions and encrypted state. Do not reset keys or retry uncertain publication blindly.' >> "$GITHUB_STEP_SUMMARY"
