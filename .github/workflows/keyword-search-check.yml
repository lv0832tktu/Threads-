name: Threads keyword search connection check (manual only)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [search, diagnose-config]
        default: search
        description: Search only when approved; diagnose-config makes no API requests
      group:
        type: choice
        options: [ai_tools, ai_general, ai_uses, work_efficiency, work_skills, career, household, investing, taxes, points, learning, hybrid, hooks, funnel]
        default: ai_tools
        description: Configured keyword category
      offset:
        type: number
        default: 0
        description: Starting keyword position (zero-based)
      count:
        type: number
        default: 3
        description: At most 10 queries per manual test
      keyword:
        type: string
        default: ''
        description: Optional single exact keyword from the catalog
      search_type:
        type: choice
        options: [RECENT, TOP]
        default: RECENT
        description: Official API result ordering
      api_version:
        type: string
        default: v1.0
        description: Explicit Threads API version; verify against official documentation before changing
      fields:
        type: choice
        options: [standard, minimal]
        default: standard
        description: Whitelisted fields preset; no automatic fallback
permissions:
  contents: read
concurrency:
  group: threads-keyword-read-test
  cancel-in-progress: false
jobs:
  check:
    if: inputs.operation == 'diagnose-config' || vars.THREADS_KEYWORD_SEARCH_TEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-private.txt -r requirements-media.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate encryption prerequisites (no API requests)
        env:
          THREADS_STATE_KEY: ${{ secrets.THREADS_STATE_KEY }}
        run: python -m threads_publisher.search_check --validate-key
      - name: GET-only keyword permission check
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_STATE_KEY: ${{ secrets.THREADS_STATE_KEY }}
          GROUP: ${{ inputs.group }}
          OFFSET: ${{ inputs.offset }}
          COUNT: ${{ inputs.count }}
          KEYWORD: ${{ inputs.keyword }}
          SEARCH_TYPE: ${{ inputs.search_type }}
          API_VERSION: ${{ inputs.api_version }}
          FIELDS: ${{ inputs.fields }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$OPERATION" = diagnose-config ]; then
            python -m threads_publisher.search_check --diagnose-config --group "$GROUP" --offset "$OFFSET" --count "$COUNT" --keyword "$KEYWORD" --search-type "$SEARCH_TYPE" --api-version "$API_VERSION" --fields "$FIELDS"
          else
            python -m threads_publisher.search_check --group "$GROUP" --offset "$OFFSET" --count "$COUNT" --keyword "$KEYWORD" --search-type "$SEARCH_TYPE" --api-version "$API_VERSION" --fields "$FIELDS"
          fi
      - name: Encrypted results (no plaintext artifact)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: encrypted-keyword-check-${{ github.run_id }}
          path: private/search-check.enc
          retention-days: 7
          if-no-files-found: ignore
