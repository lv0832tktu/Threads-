name: Prepare state key migration (no activation)
on:
  workflow_dispatch:
    inputs:
      confirm_prepare:
        description: Prepare encrypted candidate only; do not replace active state or Secrets
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: threads-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: inputs.confirm_prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-private.txt -r requirements-media.txt
      - run: python -m unittest discover -s tests -q
      - name: Prepare and verify without activating
        env:
          THREADS_STATE_KEY: ${{ secrets.THREADS_STATE_KEY }}
          THREADS_STATE_KEY_NEXT: ${{ secrets.THREADS_STATE_KEY_NEXT }}
        run: python -m threads_publisher.state_migration
      - name: Retain encrypted candidate and original only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: encrypted-state-migration-${{ github.run_id }}
          path: |
            state/private-state.next.enc
            state/private-state.before-migration.enc
          if-no-files-found: error
          retention-days: 7
